name: ziyi-g36-offline-primitives
on:
  push:
    branches: [codex/ziyi-g36-offline-primitives]
    paths: [tools/ziyi-g36/offline/**, .github/workflows/ziyi-g36-offline-primitives.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: g36-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslang-tools spirv-tools libdrm2 libudev1 libzstd1
      - name: Reuse exact qualified Mesa compiler from G34
        uses: actions/download-artifact@v4
        with:
          name: ziyi-g34-offline-triangle
          run-id: 45581919100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: g34-runtime
      - name: Validate original runtime identity and build new input only
        run: |
          mkdir g36-evidence
          printf '%s  %s\n' d3f37bd26f1dc52b54322b962fc55a8feb7628657c422f1612fdbdd6606e7c19 g34-runtime/g34-build/src/freedreno/vulkan/libvulkan_freedreno.so 9abf9a4b3c5836740588093563973f078cff3c0cf35445fb375578dfa11dacac g34-runtime/g34-build/src/freedreno/drm-shim/libfreedreno_noop_drm_shim.so > g36-evidence/runtime-sha256.txt
          sha256sum -c g36-evidence/runtime-sha256.txt
          ldd g34-runtime/g34-build/src/freedreno/vulkan/libvulkan_freedreno.so > g36-evidence/runtime-ldd.txt
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/ziyi-g36/offline/primitives.c -lvulkan -o g36-evidence/primitives-producer
          for s in primitives.vert texture.frag blend.frag depth.frag; do
            glslangValidator -V --target-env vulkan1.1 tools/ziyi-g36/offline/$s -o g36-evidence/$s.spv
            spirv-val --target-env vulkan1.1 g36-evidence/$s.spv
          done
      - name: Capture texture blend and depth commands without GPU execution
        run: |
          mkdir g36-evidence/capture
          printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s/g34-runtime/g34-build/src/freedreno/vulkan/libvulkan_freedreno.so","api_version":"1.3.0"}}\n' "$GITHUB_WORKSPACE" > g36-evidence/icd.json
          export VK_DRIVER_FILES="$GITHUB_WORKSPACE/g36-evidence/icd.json"
          export LD_PRELOAD="$GITHUB_WORKSPACE/g34-runtime/g34-build/src/freedreno/drm-shim/libfreedreno_noop_drm_shim.so"
          export FD_CHIP_ID=06060201
          export TU_DEBUG=sysmem,nobin,nolrz,noubwc
          export IR3_SHADER_DEBUG=vs,fs,disasm
          export G34_CAPTURE_DIR="$GITHUB_WORKSPACE/g36-evidence/capture"
          timeout 90 g36-evidence/primitives-producer g36-evidence/primitives.vert.spv g36-evidence/texture.frag.spv g36-evidence/blend.frag.spv g36-evidence/depth.frag.spv > g36-evidence/producer.stdout 2> g36-evidence/producer.stderr
          test -s g36-evidence/capture/submit.json
          unset LD_PRELOAD
          sha256sum g36-evidence/capture/* > g36-evidence/capture-sha256.txt
      - name: Retain exact input output and original refusal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziyi-g36-offline-primitives
          path: g36-evidence/
          if-no-files-found: error
